<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM - Login</title>
    <link rel="stylesheet" href="styles/main.css">

</head>


<body class="auth-page">
    
    <main class="auth-container">
        <section class="auth-card">
            <div class="brand">
                <h1>10X CRM</h1>
            </div>
            <header class="auth-header">
                <h2>Welcome back</h2>
                <p>Login to your CRM account</p>
            </header>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input id="loginEmail" name="email" type="email" placeholder="Enter your email">
                    <small id="loginEmailError" class="form-error"></small>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input id="loginPassword" name="password" type="password" placeholder="Enter your password">
                    <small id="loginPasswordError" class="form-error"></small>
                </div>

                <button id="loginButton" type="submit" class="btn btn-primary">Log In</button>
            </form>

            <p class="auth-footer">
                Don't have an account? <a href="signup.html">Sign up</a>
            </p>
        </section>
    </main>

    <div id="toastContainer" class="toast-container"></div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>

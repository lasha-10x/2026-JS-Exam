<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clients · 10X CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/glass.css?v=11" />
  </head>
  <body class="theme-light">
    <div class="app">
      <!-- SIDEBAR-->
      <aside class="sidebar">
        <nav class="nav-menu">
          <a href="dashboard.html" class="nav-link" data-nav="dashboard">
            <svg
              class="nav-ico"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="7" height="9" x="3" y="3" rx="1" />
              <rect width="7" height="5" x="14" y="3" rx="1" />
              <rect width="7" height="9" x="14" y="12" rx="1" />
              <rect width="7" height="5" x="3" y="16" rx="1" />
            </svg>
            Dashboard
          </a>
          <a href="clients.html" class="nav-link active" data-nav="clients">
            <svg
              class="nav-ico"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            Clients
          </a>
          <a href="tasks.html" class="nav-link" data-nav="tasks">
            <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6" />
              <path d="m9 11 3 3L22 4" />
            </svg>
            Tasks
          </a>

          <a href="profile.html" class="nav-link" data-nav="profile">
            <svg
              class="nav-ico"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            Profile
          </a>
        </nav>
        <div class="sidebar-foot">
          <a href="index.html" class="nav-link">
            <svg
              class="nav-ico"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" x2="9" y1="12" y2="12" />
            </svg>
            Log out
          </a>
        </div>
      </aside>

      <!-- ===== MAIN ===== -->
      <div class="main">
        <header class="topbar">
          <div class="topbar-left">
            <a class="logo" href="dashboard.html">
              <span class="brand-mark">10X</span>
              <span class="brand-name">10X CRM</span>
            </a>
            <h2 class="topbar-title">Clients</h2>
          </div>
          <div class="topbar-right">
            <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"
                />
              </svg>
            </button>
            <div class="dropdown" id="notifMenu">
              <button
                class="notif-btn"
                id="notifBtn"
                aria-haspopup="true"
                aria-expanded="false"
                aria-label="Notifications"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                  <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                </svg>
                <span class="notif-badge" id="notifBadge" hidden>0</span>
              </button>

              <div class="dropdown-menu notif-menu" role="menu" aria-labelledby="notifBtn">
                <div class="notif-head">
                  <span class="notif-head__title">Notifications</span>
                  <button class="notif-head__clear" id="notifClearBtn">Mark all read</button>
                </div>

                <!-- JS fills this; see GLASS-MARKUP.md for the row shape -->
                <div class="notif-list" id="notifList">
                  <div class="notif-empty">
                    <div class="notif-empty__icon" aria-hidden="true">&#9203;</div>
                    No notifications yet.
                  </div>
                </div>
              </div>
            </div>

            <div class="dropdown" id="userMenu">
              <button class="user-chip" id="userMenuBtn" aria-haspopup="true" aria-expanded="false">
                <span class="avatar avatar-initials" id="userInitials">--</span>
                <span class="u-name" id="userName">—</span>
                <span class="user-chip__caret" aria-hidden="true">▾</span>
              </button>

              <div class="dropdown-menu" role="menu" aria-labelledby="userMenuBtn">
                <a class="dropdown-item" role="menuitem" href="profile.html">Your profile</a>
                <a class="dropdown-item" role="menuitem" href="dashboard.html">Dashboard</a>
                <a class="dropdown-item is-active" role="menuitem" href="clients.html">Clients</a>
                <a class="dropdown-item" role="menuitem" href="tasks.html">Tasks</a>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item dropdown-item--danger" role="menuitem" id="logoutBtn">
                  Sign out
                </button>
              </div>
            </div>
          </div>
        </header>

        <div class="content">
          <!-- page head: title + action buttons -->
          <div class="page-head">
            <div>
              <h1>Clients</h1>
              <p class="sub">Manage your pipeline and relationships</p>
            </div>
            <div class="flex gap-1 page-actions">
              <button class="btn btn-outline" id="importBtn">Import Excel</button>
              <button class="btn btn-outline" id="exportBtn">Export CSV</button>
              <button class="btn btn-primary" id="addClientBtn">+ Add Client</button>
              <input
                type="file"
                id="importFile"
                accept=".xlsx,.xls,.csv"
                aria-label="Import clients from Excel or CSV"
                hidden
              />
            </div>
          </div>

          <!-- toolbar: search + filter chips + sort -->
          <div class="toolbar">
            <div class="search-box">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
              <input
                class="input"
                type="text"
                id="searchInput"
                placeholder="Search by name or company..."
              />
            </div>

            <div class="chips" id="filterChips">
              <button class="chip active" data-status="All">All</button>
              <button class="chip" data-status="Lead">Lead</button>
              <button class="chip" data-status="Contacted">Contacted</button>
              <button class="chip" data-status="Won">Won</button>
              <button class="chip" data-status="Lost">Lost</button>
            </div>

            <select class="input" id="sortSelect" style="width: auto">
              <option value="newest">Newest first</option>
              <option value="name">Name A→Z</option>
              <option value="deal-high">Deal value: high→low</option>
            </select>
          </div>

          <!-- clients render target (JS fills this) -->
          <div id="clientsArea"></div>
        </div>
      </div>
    </div>

    <!--Add Client modal-->
    <div class="modal-backdrop" id="addModal" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
        <div id="modalLiquid" aria-hidden="true"></div>
        <div class="modal-head">
          <h3 id="addModalTitle">Add Client</h3>
          <button class="icon-btn" data-close aria-label="Close">&times;</button>
        </div>

        <form id="addForm" novalidate>
          <div class="modal-body">
            <div class="form-grid">
              <div class="field full">
                <label for="cName">Name</label>
                <input class="input" type="text" id="cName" placeholder="Full name" />
                <small class="error-text" id="cNameErr"></small>
              </div>

              <div class="field full">
                <label for="cEmail">Email</label>
                <input class="input" type="email" id="cEmail" placeholder="client@example.com" autocomplete="email" />
                <small class="error-text" id="cEmailErr"></small>
              </div>

              <div class="field">
                <label for="cPhone">Phone</label>
                <input
                  class="input"
                  type="tel"
                  id="cPhone"
                  placeholder="Optional"
                  inputmode="tel"
                  autocomplete="tel"
                  maxlength="24"
                />
                <small class="error-text" id="cPhoneErr"></small>
              </div>

              <div class="field">
                <label for="cCompany">Company</label>
                <input class="input" type="text" id="cCompany" placeholder="Optional" />
                <small class="error-text" id="cCompanyErr"></small>
              </div>

              <div class="field">
                <label for="cDeal">Deal Value ($)</label>
                <input class="input" type="number" id="cDeal" placeholder="5000" />
                <small class="error-text" id="cDealErr"></small>
              </div>

              <div class="field">
                <label for="cStatus">Status</label>
                <select class="input" id="cStatus">
                  <option value="Lead">Lead</option>
                  <option value="Contacted">Contacted</option>
                  <option value="Won">Won</option>
                  <option value="Lost">Lost</option>
                </select>
              </div>
            </div>
          </div>

          <div class="modal-foot">
            <button type="button" class="btn btn-outline" data-close>Cancel</button>
            <button type="submit" class="btn btn-primary" id="addSubmitBtn">Add Client</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Details modal -->
    <div class="modal-backdrop" id="detailModal" aria-hidden="true">
      <div class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="detailModalTitle">
        <div class="modal-head">
          <h3 id="detailModalTitle">Client Details</h3>
          <button class="icon-btn" data-close aria-label="Close">&times;</button>
        </div>
        <div class="modal-body" id="detailBody"><!-- filled by JS --></div>
      </div>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/guard.js"></script>
    <script src="js/data.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/integrations.js"></script>
    <script src="js/clients.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="js/glass-depth-bg.js?v=4"></script>
    <script src="js/glass-liquid.js?v=6"></script>
    <script src="js/glass-ui.js?v=7"></script>
  </body>
</html>

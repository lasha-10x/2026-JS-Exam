<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In | 10X CRM</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="assets/js/storage.js" defer></script>
    <script src="assets/js/ui.js" defer></script>
    <script src="assets/js/auth.js" defer></script>
    <script src="assets/js/pages/login.js" defer></script>
  </head>
  <body data-page="login">
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="login-title">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">10X</span>
          <span>CRM</span>
        </div>
        <h1 id="login-title">Welcome back</h1>
        <p class="muted">Sign in to manage your sales pipeline.</p>

        <form id="login-form" class="form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" spellcheck="false" />
            <p class="error" id="email-error"></p>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" />
            <p class="error" id="password-error"></p>
          </div>
          <p class="form-error" id="form-error" role="alert"></p>
          <button class="button primary full" type="submit">Log In</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
      </section>
    </main>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>

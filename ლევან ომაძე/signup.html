<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | 10X CRM</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="assets/js/storage.js" defer></script>
    <script src="assets/js/ui.js" defer></script>
    <script src="assets/js/auth.js" defer></script>
    <script src="assets/js/pages/signup.js" defer></script>
  </head>
  <body data-page="signup">
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="signup-title">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">10X</span>
          <span>CRM</span>
        </div>
        <h1 id="signup-title">Create your account</h1>
        <p class="muted">Start tracking leads, deals, notes, and follow-ups.</p>

        <form id="signup-form" class="form" novalidate>
          <div class="field">
            <label for="fullName">Full Name</label>
            <input id="fullName" name="fullName" type="text" autocomplete="name" />
            <p class="error" id="fullName-error"></p>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="text" autocomplete="email" spellcheck="false" />
            <p class="error" id="email-error"></p>
          </div>
          <div class="field">
            <label for="company">Company</label>
            <input id="company" name="company" type="text" autocomplete="organization" placeholder="Company (optional)" />
            <p class="error" id="company-error"></p>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" />
            <p class="error" id="password-error"></p>
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" />
            <p class="error" id="confirmPassword-error"></p>
          </div>
          <button class="button primary full" type="submit">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="index.html">Log in</a></p>
      </section>
    </main>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>

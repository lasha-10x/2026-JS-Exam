<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>10X CRM | Clients</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/clients.css">
    <link rel="stylesheet" href="css/modal.css">


</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <h2 class="logo"><a href="dashboard.html">10X CRM</a></h2>

        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="clients.html" class="active">
                Clients
            </a>

            <a href="profile.html">
                Profile
            </a>

        </nav>
        <button id="logoutBtn">
            Logout
        </button>

    </aside>

    <main>
        <section class="togglebtn">
            <span>🌙</span>

            <label class="switch">
                <input type="checkbox" id="themeToggle">
                <span class="slider"></span>
            </label>

            <span>☀️</span>
        </section>
            <div class="page-header">

                <h1>Clients</h1>

                <button id="openModalBtn"> + Add Client</button>

            </div>

        <div class="toolbar">

           <input type="text" id="searchInput" placeholder="Search client..."> 

            <select id="statusFilter">

                <option value="All">All Status</option>
                <option value="lead">Lead</option>
                <option value="won">Won</option>
                <option value="lost">Lost</option>

            </select>
            <select id="sortClients">

                <option value="newest">Newest</option>
                <option value="az">Name (A-Z)</option>
                <option value="za">Name (Z-A)</option>
                <option value="dealHigh">Deal Value ↓</option>
                <option value="dealLow">Deal Value ↑</option>

            </select>


        </div>

        <div id="clientsContainer">

            <div class="empty-state">

                <h2>No Clients Yet</h2>

                <p>
                    Clients from DummyJSON API will appear here.
                </p>

            </div>

        </div>

    </main>

</div>

<!-- Modal for Adding Client -->

<div id="clientModal" class="modal">

    <div class="modal-content">

        <span id="closeModalBtn" class="close">

            &times;

        </span>

        <h2>Add Client</h2>

        <form id="clientForm">

            <input type="text" id="clientName" placeholder="Full Name">
            <span id="nameError" class="error"></span>

            <input type="email" id="clientEmail" placeholder="Email">
            <span id="emailError" class="error"></span>

            <input type="text" id="clientPhone" placeholder="Phone">
            <span id="phoneError" class="error"></span>

            <input type="text" id="clientCompany" placeholder="Company">
            <span id="companyError" class="error"></span>

            <input type="number" id="clientDeal" placeholder="Deal Value">
            <span id="dealError" class="error"></span>

            <select id="clientStatus">

                <option value="lead">Lead</option>

                <option value="won">Won</option>

                <option value="lost">Lost</option>

            </select>

            <button type="submit">

                Add Client

            </button>

        </form>

    </div>

</div>
<!-- end Modal for Adding Client -->

<!-- Modal for viewing Client -->

<div id="viewModal" class="modal">

    <div class="modal-content">

        <span id="closeViewModalBtn" class="close">

            &times;

        </span>

        <h2>Client Details</h2>

        <div class="client-details">

            <p>
                <strong>Full Name:</strong>
                <span id="viewName"></span>
            </p>
            <p>
                <strong>Email:</strong>
                <span id="viewEmail"></span>
            </p>
            <p>
                <strong>Phone:</strong>
                <span id="viewPhone"></span>
            </p>
            <p>
                <strong>Company:</strong>
                <span id="viewCompany"></span>
            </p>
            <p>
                <strong>Deal Value:</strong>
                <span id="viewDeal"></span>
            </p>
            <p>
                <strong>Status:</strong>
                <span id="viewStatus"></span>
            </p>
            <p>
                <strong>Created:</strong>
                <span id="viewCreated"></span>
            </p>

        </div>

    </div>

</div>

<!-- end Modal for viewing Client -->

<!-- Modal for Editing Client -->

<div id="editModal" class="modal">
    <div class="modal-content">
        <span id="closeEditModalBtn" class="close">&times;</span>
        <h2>Edit Client</h2>

        <form id="editClientForm">

            <input type="text" id="editName" placeholder="Full Name" required>
            <span id="editNameError" class="error"></span>

            <input type="email" id="editEmail" placeholder="Email" required>
            <span id="editEmailError" class="error"></span>

            <input type="text" id="editPhone" placeholder="Phone" required>
            <span id="editPhoneError" class="error"></span>

            <input type="text" id="editCompany" placeholder="Company" required>
            <span id="editCompanyError" class="error"></span>

            <input type="number" id="editDeal" placeholder="Deal Value" required>
            <span id="editDealError" class="error"></span>

            <select id="editStatus">
                <option value="lead">Lead</option>
                <option value="won">Won</option>
                <option value="lost">Lost</option>
            </select>

            <button type="submit">Save Changes</button>

        </form>
    </div>
</div>

<!-- end Modal for Editing Client -->


<!-- Modal for deleting Client -->

<div id="deleteModal" class="modal">

    <div class="modal-content confirm-modal">

        <h2>Delete Client</h2>

        <p>
            Are you sure you want to delete this client?
        </p>

        <div class="confirm-actions">

            <button id="cancelDeleteBtn">
                Cancel
            </button>

            <button id="confirmDeleteBtn">
                Delete
            </button>

        </div>

    </div>

</div>

<!-- end Modal for deleting Client -->

<div id="toast" class="toast"></div>

<script src="js/storage.js"></script>
<script src="js/guard.js"></script>
<script src="js/theme.js"></script>
<script src="js/validation.js"></script>
<script src="js/clients.js"></script>

</body>
</html>

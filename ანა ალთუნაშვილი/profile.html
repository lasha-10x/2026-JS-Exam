<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — 10X CRM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="profile">

  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="main-content">
      <div class="page-header">
        <h1>Profile</h1>
      </div>

      <div class="card profile-info-card">
        <div class="client-avatar-initials avatar-lg" id="profile-avatar"></div>
        <div>
          <div class="profile-fullname" id="profile-fullname"></div>
          <div class="profile-email" id="profile-email"></div>
          <div class="profile-meta" id="profile-meta"></div>
        </div>
      </div>

      <div class="profile-grid">
        <div class="card">
          <h3>Edit Profile</h3>
          <form id="edit-profile-form" novalidate>
            <div class="field" id="field-editFullName">
              <label for="editFullName">Full Name</label>
              <input type="text" id="editFullName" name="editFullName" />
              <div class="field-error" id="error-editFullName"></div>
            </div>
            <div class="field" id="field-editCompany">
              <label for="editCompany">Company</label>
              <input type="text" id="editCompany" name="editCompany" placeholder="Company (optional)" />
              <div class="field-error" id="error-editCompany"></div>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>

        <div class="card">
          <h3>Change Password</h3>
          <form id="change-password-form" novalidate>
            <div class="field" id="field-currentPassword">
              <label for="currentPassword">Current Password</label>
              <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" />
              <div class="field-error" id="error-currentPassword"></div>
            </div>
            <div class="field" id="field-newPassword">
              <label for="newPassword">New Password</label>
              <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" />
              <div class="field-error" id="error-newPassword"></div>
            </div>
            <div class="field" id="field-confirmNewPassword">
              <label for="confirmNewPassword">Confirm New Password</label>
              <input type="password" id="confirmNewPassword" name="confirmNewPassword" autocomplete="new-password" />
              <div class="field-error" id="error-confirmNewPassword"></div>
            </div>
            <button type="submit" class="btn btn-primary">Change Password</button>
          </form>
        </div>
      </div>

      <div class="card danger-zone">
        <h3>Reset CRM Data</h3>
        <p>Deletes every client and reloads the original 30 from the API. Your account and login are not affected.</p>
        <button class="btn btn-danger" id="reset-data-btn" type="button">Reset CRM Data</button>
      </div>
    </main>
  </div>

  <div id="toast-stack"></div>

  <script src="js/storage.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/data.js"></script>
  <script src="js/profile.js"></script>
  <script>
    requireAuth(); // P0.1 — bounce to index.html if there's no session
    initProfilePage();
  </script>
</body>
</html>

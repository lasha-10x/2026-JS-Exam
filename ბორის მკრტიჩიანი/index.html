<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10X CRM - Login</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div id="toast" role="status" aria-live="polite"></div>
    <div class="auth-container">
      <div class="auth-brand">
        <i class="fa-solid fa-chart-simple auth-brand-icon"></i>
        <h2>Welcome back</h2>
        <p class="auth-subtitle">Sign in to your 10X CRM account.</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-envelope"></i>
            <input type="text" id="login-email" placeholder="Enter email" autocomplete="email" />
          </div>
          <span class="error-text" id="login-email-error"></span>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-icon-wrap">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              id="login-password"
              placeholder="Enter password"
              autocomplete="current-password"
            />
            <button type="button" class="pw-toggle-btn" data-target="login-password" title="Show/hide password">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <span class="error-text" id="login-password-error"></span>
        </div>

        <div class="login-meta">
          <label class="remember-me" for="remember-me">
            <input type="checkbox" id="remember-me" />
            <span>Remember me</span>
          </label>
          <a href="forgot-password.html" class="forgot-link">
            <i class="fa-solid fa-key"></i> Forgot password?
          </a>
        </div>

        <button type="submit">Log In</button>
      </form>

      <p>Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>

    <button id="theme-toggle">
      <i id="theme-icon" class="fa-solid fa-moon"></i>
    </button>

    <script src="js/guard.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
  </body>
</html>

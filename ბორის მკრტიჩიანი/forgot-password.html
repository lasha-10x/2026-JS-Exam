<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10X CRM – Forgot Password</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div id="toast" role="status" aria-live="polite"></div>

    <div class="auth-container" id="fp-container">

      <!-- ── Step 1: enter email ───────────────────────────────────────── -->
      <div id="fp-step-email">
        <div class="auth-brand">
          <i class="fa-solid fa-lock-open auth-brand-icon"></i>
          <h2>Forgot Password</h2>
          <p class="auth-subtitle">Enter your email and we'll send a reset code.</p>
        </div>

        <form id="fp-email-form" novalidate>
          <div class="form-group">
            <label for="fp-email">Email address</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" id="fp-email" placeholder="you@example.com" autocomplete="email" />
            </div>
            <span class="error-text" id="fp-email-error"></span>
          </div>
          <button type="submit" id="fp-send-btn">
            <i class="fa-solid fa-paper-plane"></i> Send Reset Code
          </button>
        </form>

        <p><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Login</a></p>
      </div>

      <!-- ── Step 2: verify OTP + new password ────────────────────────── -->
      <div id="fp-step-verify" class="hidden">
        <div class="auth-brand">
          <i class="fa-solid fa-shield-halved auth-brand-icon"></i>
          <h2>Reset Password</h2>
          <p class="auth-subtitle">Check the code displayed below and enter your new password.</p>
        </div>

        <!-- simulated "email" banner -->
        <div class="email-sim-banner" id="fp-otp-banner">
          <i class="fa-solid fa-envelope-open-text"></i>
          <div>
            <strong>Simulated email to <span id="fp-banner-email"></span></strong>
            <p>Your reset code: <span id="fp-otp-display" class="otp-code"></span></p>
          </div>
        </div>

        <form id="fp-reset-form" novalidate>
          <div class="form-group">
            <label for="fp-otp-input">6-Digit Code</label>
            <div class="otp-boxes" id="fp-otp-boxes">
              <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" />
              <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" />
              <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" />
              <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" />
              <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" />
              <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" />
            </div>
            <span class="error-text" id="fp-otp-error"></span>
          </div>

          <div class="form-group">
            <label for="fp-new-password">New Password</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="fp-new-password" placeholder="New password" autocomplete="new-password" />
              <button type="button" class="pw-toggle-btn" data-target="fp-new-password" title="Show/hide password">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <!-- Enhanced strength meter -->
            <div id="fp-password-strength" class="password-strength" aria-live="polite">
              <div class="strength-segments">
                <span class="seg"></span><span class="seg"></span>
                <span class="seg"></span><span class="seg"></span><span class="seg"></span>
              </div>
              <span class="strength-label"></span>
            </div>
            <ul class="pw-checklist" id="fp-pw-checklist">
              <li data-rule="length"><i class="fa-solid fa-circle-xmark"></i> 8+ characters</li>
              <li data-rule="upper"><i class="fa-solid fa-circle-xmark"></i> Uppercase letter</li>
              <li data-rule="lower"><i class="fa-solid fa-circle-xmark"></i> Lowercase letter</li>
              <li data-rule="number"><i class="fa-solid fa-circle-xmark"></i> Number</li>
              <li data-rule="symbol"><i class="fa-solid fa-circle-xmark"></i> Symbol (!@#…)</li>
            </ul>
            <span class="error-text" id="fp-new-password-error"></span>
          </div>

          <div class="form-group">
            <label for="fp-confirm-password">Confirm Password</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="fp-confirm-password" placeholder="Confirm new password" autocomplete="new-password" />
            </div>
            <span class="error-text" id="fp-confirm-error"></span>
          </div>

          <button type="submit" id="fp-reset-btn">
            <i class="fa-solid fa-key"></i> Reset Password
          </button>
        </form>

        <div class="resend-row">
          <button type="button" id="fp-resend-btn" class="link-btn" disabled>
            <i class="fa-solid fa-rotate-right"></i>
            Resend code <span id="fp-resend-timer"></span>
          </button>
        </div>
      </div>

    </div>

    <button id="theme-toggle">
      <i id="theme-icon" class="fa-solid fa-moon"></i>
    </button>

    <script src="./js/guard.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/theme.js"></script>
  </body>
</html>

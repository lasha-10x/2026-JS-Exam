<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Profile | 10X CRM</title>

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/clients.css" />
  </head>

  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <a href="dashboard.html" class="brand">10X CRM</a>

        <nav class="navigation">
          <a href="dashboard.html" class="nav-link">
            Dashboard
          </a>

          <a href="clients.html" class="nav-link">
            Clients
          </a>

          <a href="profile.html" class="nav-link active">
            Profile
          </a>
        </nav>

        <div class="sidebar-actions">
          <button
            id="themeButton"
            class="secondary-button"
            type="button"
          >
            Switch Theme
          </button>

          <button
            id="logoutButton"
            class="logout-button"
            type="button"
          >
            Logout
          </button>
        </div>
      </aside>

      <main class="app-content">
        <header class="page-header">
          <div>
            <h1>Profile</h1>
            <p>Manage your account information and CRM data.</p>
          </div>
        </header>

        <section class="profile-grid">
          <article class="profile-card profile-summary">
            <div id="profileAvatar" class="profile-avatar">
              U
            </div>

            <h2 id="profileDisplayName">User Name</h2>

            <p id="profileDisplayEmail">user@example.com</p>

            <p id="profileDisplayCompany">No company</p>

            <span id="profileMemberSince">
              Member since —
            </span>
          </article>

          <article class="profile-card">
            <h2>Edit Profile</h2>

            <form id="profileForm" novalidate>
              <div class="form-group">
                <label for="profileFullName">Full Name</label>

                <input
                  id="profileFullName"
                  type="text"
                  autocomplete="name"
                />

                <small
                  id="profileFullNameError"
                  class="field-error"
                ></small>
              </div>

              <div class="form-group">
                <label for="profileCompany">Company</label>

                <input
                  id="profileCompany"
                  type="text"
                  placeholder="Company (optional)"
                  autocomplete="organization"
                />
              </div>

              <button type="submit">
                Save Changes
              </button>
            </form>
          </article>

          <article class="profile-card">
            <h2>Change Password</h2>

            <form id="passwordForm" novalidate>
              <div class="form-group">
                <label for="currentPassword">
                  Current Password
                </label>

                <input
                  id="currentPassword"
                  type="password"
                  autocomplete="current-password"
                />

                <small
                  id="currentPasswordError"
                  class="field-error"
                ></small>
              </div>

              <div class="form-group">
                <label for="newPassword">
                  New Password
                </label>

                <input
                  id="newPassword"
                  type="password"
                  autocomplete="new-password"
                />

                <small
                  id="newPasswordError"
                  class="field-error"
                ></small>
              </div>

              <div class="form-group">
                <label for="confirmNewPassword">
                  Confirm New Password
                </label>

                <input
                  id="confirmNewPassword"
                  type="password"
                  autocomplete="new-password"
                />

                <small
                  id="confirmNewPasswordError"
                  class="field-error"
                ></small>
              </div>

              <button type="submit">
                Change Password
              </button>
            </form>
          </article>

          <article class="profile-card danger-zone">
            <h2>Reset CRM Data</h2>

            <p>
              This will remove all saved clients and reload the
              original 30 clients from the API.
            </p>

            <button
              id="resetClientsButton"
              class="danger-button"
              type="button"
            >
              Reset CRM Data
            </button>
          </article>
        </section>
      </main>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="./js/storage.js"></script>
    <script src="./js/guard.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/data.js"></script>
    <script src="./js/profile.js"></script>
  </body>
</html>

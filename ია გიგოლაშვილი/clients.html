<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Clients | 10X CRM</title>

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/clients.css" />
  </head>

  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <a href="dashboard.html" class="brand">
          10X CRM
        </a>

        <nav class="navigation">
          <a href="dashboard.html" class="nav-link">
            Dashboard
          </a>

          <a href="clients.html" class="nav-link active">
            Clients
          </a>

          <a href="profile.html" class="nav-link">
            Profile
          </a>
        </nav>

        <div class="sidebar-actions">
          <button
            id="themeButton"
            class="secondary-button"
            type="button"
          >
            Switch Theme
          </button>

          <button
            id="logoutButton"
            class="logout-button"
            type="button"
          >
            Logout
          </button>
        </div>
      </aside>

      <main class="app-content">
        <header class="page-header">
          <div>
            <h1>Clients</h1>
            <p>Manage your clients and sales pipeline.</p>
          </div>

          <button
            id="openAddClientModal"
            class="add-client-button"
            type="button"
          >
            + Add Client
          </button>
        </header>

        <section class="clients-toolbar">
          <input
            id="clientSearch"
            class="search-input"
            type="search"
            placeholder="Search by name or company"
          />

          <div class="filter-chips">
            <button
              class="filter-chip active"
              type="button"
              data-status="All"
            >
              All
            </button>

            <button
              class="filter-chip"
              type="button"
              data-status="Lead"
            >
              Lead
            </button>

            <button
              class="filter-chip"
              type="button"
              data-status="Contacted"
            >
              Contacted
            </button>

            <button
              class="filter-chip"
              type="button"
              data-status="Won"
            >
              Won
            </button>

            <button
              class="filter-chip"
              type="button"
              data-status="Lost"
            >
              Lost
            </button>
          </div>

          <select id="clientSort" class="sort-select">
            <option value="newest">
              Newest first
            </option>

            <option value="name">
              Name A → Z
            </option>

            <option value="dealValue">
              Deal value: high → low
            </option>
          </select>
        </section>

        <section
          id="clientsContainer"
          class="clients-grid"
        >
          <p class="loading-message">
            Loading clients...
          </p>
        </section>
      </main>
    </div>

    <div id="addClientModal" class="modal hidden">
      <div class="modal-content">
        <button
          id="closeAddClientModal"
          class="modal-close"
          type="button"
        >
          ×
        </button>

        <h2>Add Client</h2>

        <form id="addClientForm" novalidate>
          <div class="form-group">
            <label for="clientName">Name</label>

            <input
              id="clientName"
              type="text"
              placeholder="Enter client name"
            />

            <small
              id="clientNameError"
              class="field-error"
            ></small>
          </div>

          <div class="form-group">
            <label for="clientEmail">Email</label>

            <input
              id="clientEmail"
              type="text"
              placeholder="Enter client email"
            />

            <small
              id="clientEmailError"
              class="field-error"
            ></small>
          </div>

          <div class="form-group">
            <label for="clientPhone">Phone</label>

            <input
              id="clientPhone"
              type="text"
              placeholder="Enter phone number"
            />

            <small
              id="clientPhoneError"
              class="field-error"
            ></small>
          </div>

          <div class="form-group">
            <label for="clientCompany">Company</label>

            <input
              id="clientCompany"
              type="text"
              placeholder="Enter company"
            />
          </div>

          <div class="form-group">
            <label for="clientDealValue">
              Deal Value
            </label>

            <input
              id="clientDealValue"
              type="number"
              placeholder="Enter deal value"
            />

            <small
              id="clientDealValueError"
              class="field-error"
            ></small>
          </div>

          <div class="form-group">
            <label for="clientStatus">Status</label>

            <select id="clientStatus">
              <option value="Lead">Lead</option>
              <option value="Contacted">Contacted</option>
              <option value="Won">Won</option>
              <option value="Lost">Lost</option>
            </select>
          </div>

          <button type="submit">
            Add Client
          </button>
        </form>
      </div>
    </div>

    <div id="clientDetailsModal" class="modal hidden">
      <div class="modal-content client-details-content">
        <button
          id="closeClientDetailsModal"
          class="modal-close"
          type="button"
        >
          ×
        </button>

        <div id="clientDetailsInfo"></div>

        <section class="notes-section">
          <h3>Notes</h3>

          <div
            id="clientNotesList"
            class="notes-list"
          ></div>

          <form id="addNoteForm">
            <textarea
              id="clientNoteInput"
              rows="3"
              placeholder="Add a note..."
            ></textarea>

            <button type="submit">
              Add Note
            </button>
          </form>
        </section>

        <button
          id="reminderButton"
          class="secondary-button reminder-button"
          type="button"
        >
          Remind me in 1 min
        </button>
      </div>
    </div>

    <div
      id="toastContainer"
      class="toast-container"
    ></div>

    <script src="./js/storage.js"></script>
    <script src="./js/guard.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/data.js"></script>
    <script src="./js/clients.js"></script>
  </body>
</html>

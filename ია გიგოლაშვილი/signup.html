<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Sign Up | 10X CRM</title>

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <main class="login-page">
      <section class="login-card">
        <h1>Create your account</h1>

        <p>Start managing your clients with 10X CRM</p>

        <form id="signupForm" novalidate>
          <div class="form-group">
            <label for="fullName">Full Name</label>

            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="Enter your full name"
              autocomplete="name"
            />

            <small id="fullNameError" class="field-error"></small>
          </div>

          <div class="form-group">
            <label for="signupEmail">Email</label>

            <input
              type="text"
              id="signupEmail"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
            />

            <small id="signupEmailError" class="field-error"></small>
          </div>

          <div class="form-group">
            <label for="company">Company</label>

            <input
              type="text"
              id="company"
              name="company"
              placeholder="Company (optional)"
              autocomplete="organization"
            />

            <small id="companyError" class="field-error"></small>
          </div>

          <div class="form-group">
            <label for="signupPassword">Password</label>

            <input
              type="password"
              id="signupPassword"
              name="password"
              placeholder="Create a password"
              autocomplete="new-password"
            />

            <small id="signupPasswordError" class="field-error"></small>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your password"
              autocomplete="new-password"
            />

            <small id="confirmPasswordError" class="field-error"></small>
          </div>

          <button type="submit">Create Account</button>
        </form>

        <p>
          Already have an account?
          <a href="index.html">Log in</a>
        </p>
      </section>
    </main>

    <div id="toastContainer" class="toast-container"></div>

    <script src="./js/storage.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/guard.js"></script>
    <script src="./js/signup.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — 10X CRM</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/guard.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/ui.js" defer></script>
</head>
<body data-page="public">
  <div class="auth-wrap">
    <div class="auth-card">
      <span class="auth-brand">10X CRM</span>
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to manage your clients</p>

      <form id="login-form" novalidate>
        <label for="login-email">Email</label>
        <input type="text" id="login-email" placeholder="you@example.com" />

        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Your password" />

        <button type="submit" class="btn btn-block">Log In</button>
      </form>

      <p class="auth-footer">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>
</body>
</html>

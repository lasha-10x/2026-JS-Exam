<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile — 10X CRM</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/guard.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/profile.js" defer></script>
  </head>
  <body data-page="protected">
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-top">
          <a class="logo" href="dashboard.html">10X CRM</a>
          <button
            id="menu-toggle"
            class="btn btn-ghost menu-toggle"
            title="Menu"
            aria-label="Menu"
            aria-expanded="false"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
        </div>
        <nav>
          <a href="dashboard.html">Dashboard</a>
          <a href="clients.html">Clients</a>
          <a href="profile.html" class="active">Profile</a>
        </nav>
        <div class="sidebar-bottom">
          <button id="theme-toggle" class="btn btn-ghost" title="Toggle theme">
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="4"></circle>
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
              ></path>
            </svg>
          </button>
          <button id="logout-btn" class="btn btn-ghost">Logout</button>
        </div>
      </aside>

      <main class="main">
        <div class="page-header">
          <h1>Profile</h1>
        </div>

        <div class="profile-grid">
          <div class="panel">
            <div class="profile-info">
              <div class="profile-avatar" id="profile-avatar"></div>
              <div>
                <h2 id="profile-name" style="margin-bottom: 2px"></h2>
                <div class="profile-meta" id="profile-email"></div>
                <div class="profile-meta" id="profile-company"></div>
                <div class="profile-meta" id="profile-since"></div>
              </div>
            </div>
          </div>
          <div class="panel">
            <h2>Edit Profile</h2>
            <form id="edit-form" novalidate>
              <label for="edit-name">Full Name</label>
              <input type="text" id="edit-name" />

              <label for="edit-company">Company</label>
              <input
                type="text"
                id="edit-company"
                placeholder="Company (optional)"
              />

              <button type="submit" class="btn btn-block">Save Changes</button>
            </form>
          </div>
          <div class="panel">
            <h2>Change Password</h2>
            <form id="password-form" novalidate>
              <label for="current-password">Current Password</label>
              <input type="password" id="current-password" />

              <label for="new-password">New Password</label>
              <input type="password" id="new-password" />

              <label for="confirm-password">Confirm New Password</label>
              <input type="password" id="confirm-password" />

              <button type="submit" class="btn btn-block">
                Change Password
              </button>
            </form>
          </div>
          <div class="panel">
            <h2>Data Management</h2>
            <p class="profile-meta" style="margin-bottom: 14px">
              Reset the client database to the original 30 clients from the API.
              Your account and session are not affected.
            </p>
            <button id="reset-btn" class="btn btn-danger">
              Reset CRM Data
            </button>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>

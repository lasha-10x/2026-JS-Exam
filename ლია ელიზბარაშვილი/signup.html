<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — 10X CRM</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/guard.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/ui.js" defer></script>
</head>
<body data-page="public">
  <div class="auth-wrap">
    <div class="auth-card">
      <span class="auth-brand">10X CRM</span>
      <h1>Create your account</h1>
      <p class="subtitle">Start managing your sales pipeline</p>

      <form id="signup-form" novalidate>
        <label for="signup-name">Full Name</label>
        <input type="text" id="signup-name" placeholder="Nino Beridze" />

        <label for="signup-email">Email</label>
        <input type="text" id="signup-email" placeholder="you@example.com" />

        <label for="signup-company">Company</label>
        <input type="text" id="signup-company" placeholder="Company (optional)" />

        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" placeholder="Min. 8 characters, letter + number" />

        <label for="signup-confirm">Confirm Password</label>
        <input type="password" id="signup-confirm" placeholder="Repeat your password" />

        <button type="submit" class="btn btn-block">Create Account</button>
      </form>

      <p class="auth-footer">Already have an account? <a href="index.html">Log in</a></p>
    </div>
  </div>
</body>
</html>

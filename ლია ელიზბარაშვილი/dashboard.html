<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — 10X CRM</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/guard.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/dashboard.js" defer></script>
  </head>
  <body data-page="protected">
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-top">
          <a class="logo" href="dashboard.html">10X CRM</a>
          <button
            id="menu-toggle"
            class="btn btn-ghost menu-toggle"
            title="Menu"
            aria-label="Menu"
            aria-expanded="false"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
        </div>
        <nav>
          <a href="dashboard.html" class="active">Dashboard</a>
          <a href="clients.html">Clients</a>
          <a href="profile.html">Profile</a>
        </nav>
        <div class="sidebar-bottom">
          <button id="theme-toggle" class="btn btn-ghost" title="Toggle theme">
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="4"></circle>
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
              ></path>
            </svg>
          </button>
          <button id="logout-btn" class="btn btn-ghost">Logout</button>
        </div>
      </aside>

      <main class="main">
        <div class="welcome-bar">
          <h1 id="welcome-text">Welcome back!</h1>
          <p class="clock" id="live-clock"></p>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Total Clients</div>
            <div class="stat-value" id="stat-total">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Active Deals</div>
            <div class="stat-value" id="stat-active">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Won Revenue</div>
            <div class="stat-value" id="stat-revenue">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">New This Week</div>
            <div class="stat-value" id="stat-new">—</div>
          </div>
        </div>

        <div class="panel">
          <h2>Pipeline Overview</h2>
          <div class="pipeline-grid" id="pipeline"></div>
        </div>

        <div class="panel">
          <h2>Recent Clients</h2>
          <div id="recent-clients"><p class="list-message">Loading...</p></div>
          <a class="view-all" href="clients.html">View all clients →</a>
        </div>
      </main>
    </div>
  </body>
</html>

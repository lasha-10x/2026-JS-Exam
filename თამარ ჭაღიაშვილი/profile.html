<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile · 10X CRM</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-mount"></aside>

    <main class="main">
      <div class="page-header">
        <div><h1>Profile</h1></div>
      </div>

      <div class="profile-head">
        <div class="avatar-fallback" id="profile-avatar"></div>
        <div>
          <div id="profile-name" style="font-weight:600; font-size:16px;"></div>
          <div class="text-muted" id="profile-email" style="font-size:13px;"></div>
          <div class="text-muted" id="profile-company" style="font-size:13px;"></div>
          <div class="member-since" id="profile-since"></div>
        </div>
      </div>

      <div class="profile-grid">
        <div class="card">
          <h4 class="section-title">Edit Profile</h4>
          <form id="edit-profile-form" novalidate>
            <div class="field" id="field-edit-fullname">
              <label for="edit-fullname-input">Full Name</label>
              <input type="text" id="edit-fullname-input">
              <div class="error-text"></div>
            </div>
            <div class="field">
              <label for="edit-company-input">Company</label>
              <input type="text" id="edit-company-input">
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>

        <div class="card">
          <h4 class="section-title">Change Password</h4>
          <form id="change-password-form" novalidate>
            <div class="field" id="field-current-password">
              <label for="current-password-input">Current Password</label>
              <input type="password" id="current-password-input" autocomplete="current-password">
              <div class="error-text"></div>
            </div>
            <div class="field" id="field-new-password">
              <label for="new-password-input">New Password</label>
              <input type="password" id="new-password-input" autocomplete="new-password">
              <div class="error-text"></div>
            </div>
            <div class="field" id="field-confirm-new-password">
              <label for="confirm-new-password-input">Confirm New Password</label>
              <input type="password" id="confirm-new-password-input" autocomplete="new-password">
              <div class="error-text"></div>
            </div>
            <button type="submit" class="btn btn-primary">Change Password</button>
          </form>
        </div>
      </div>

      <div class="card danger-zone mt-16">
        <h4 class="section-title">Data Management</h4>
        <p class="text-muted" style="font-size:13px; margin-bottom:14px;">
          Wipes locally stored clients and reloads a fresh set from the API. Your account and login stay untouched.
        </p>
        <button class="btn btn-danger" id="reset-data-btn" type="button">Reset CRM Data</button>
      </div>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/data.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>

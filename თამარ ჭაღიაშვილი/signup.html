<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up · 10X CRM</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="mark">10X</div>
        <div class="name">10X CRM</div>
      </div>

      <h1>Create your account</h1>
      <p class="auth-sub">Set up your CRM in under a minute.</p>

      <form id="signup-form" novalidate>
        <div class="field" id="field-fullname">
          <label for="signup-fullname">Full Name</label>
          <input type="text" id="signup-fullname" autocomplete="name">
          <div class="error-text"></div>
        </div>

        <div class="field" id="field-email">
          <label for="signup-email">Email</label>
          <input type="text" id="signup-email" autocomplete="email">
          <div class="error-text"></div>
        </div>

        <div class="field" id="field-company">
          <label for="signup-company">Company</label>
          <input type="text" id="signup-company" placeholder="Company (optional)" autocomplete="organization">
          <div class="error-text"></div>
        </div>

        <div class="field" id="field-password">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" autocomplete="new-password">
          <div class="error-text"></div>
        </div>

        <div class="field" id="field-confirm-password">
          <label for="signup-confirm-password">Confirm Password</label>
          <input type="password" id="signup-confirm-password" autocomplete="new-password">
          <div class="error-text"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <div class="auth-foot">
        Already have an account? <a href="index.html">Log in</a>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/auth.js"></script>
  <script>initPublicPage();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10X CRM — Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="app-layout">
    <aside class="sidebar">
      <a class="sidebar-logo" href="dashboard.html">10X CRM</a>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><span class="icon">📊</span> Dashboard</a>
        <a href="clients.html"><span class="icon">👥</span> Clients</a>
        <a href="profile.html"><span class="icon">⚙️</span> Profile</a>
      </nav>
      <div class="sidebar-footer">
        <button class="theme-toggle" id="theme-toggle">☀️ Light Mode</button>
        <button class="logout-btn" id="logout-btn">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="welcome-bar">
        <h2 id="welcome-text">Welcome back!</h2>
        <div class="clock" id="clock"></div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="label">Total Clients</div>
          <div class="value blue" id="stat-total">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Active Deals</div>
          <div class="value" id="stat-active">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Won Revenue</div>
          <div class="value green" id="stat-won">$0</div>
        </div>
        <div class="stat-card">
          <div class="label">New This Week</div>
          <div class="value" id="stat-week">0</div>
        </div>
      </div>

      <div class="dashboard-grid">
        <div class="dashboard-card">
          <h3>Pipeline Overview</h3>
          <div class="pipeline-row">
            <div class="pipeline-item">
              <div class="count" id="p-lead">0</div>
              <div class="name">Lead</div>
              <div class="pipeline-progress" id="progress-lead" role="progressbar" aria-label="Lead clients"
                aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <span class="pipeline-progress-fill lead" id="bar-lead"></span>
              </div>
            </div>

            <div class="pipeline-item">
              <div class="count" id="p-contacted">0</div>
              <div class="name">Contacted</div>
              <div class="pipeline-progress" id="progress-contacted" role="progressbar" aria-label="Contacted clients"
                aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <span class="pipeline-progress-fill contacted" id="bar-contacted"></span>
              </div>
            </div>

            <div class="pipeline-item">
              <div class="count" id="p-won">0</div>
              <div class="name">Won</div>
              <div class="pipeline-progress" id="progress-won" role="progressbar" aria-label="Won clients"
                aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <span class="pipeline-progress-fill won" id="bar-won"></span>
              </div>
            </div>

            <div class="pipeline-item">
              <div class="count" id="p-lost">0</div>
              <div class="name">Lost</div>
              <div class="pipeline-progress" id="progress-lost" role="progressbar" aria-label="Lost clients"
                aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <span class="pipeline-progress-fill lost" id="bar-lost"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="dashboard-card">
          <h3>Recent Clients</h3>
          <div id="recent-list"></div>
          <a href="clients.html" class="view-all-link">View all clients →</a>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/auth.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/data.js"></script>
  <script src="js/dashboard.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Profile - 10X CRM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app">
  <div id="toast-container"></div>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="logo">10X CRM</div>
      <nav>
        <a href="dashboard.html" id="nav-dashboard">Dashboard</a>
        <a href="clients.html" id="nav-clients">Clients</a>
        <a href="profile.html" id="nav-profile">Profile</a>
      </nav>
      <div class="bottom-actions">
        <button id="theme-toggle-btn">Toggle Theme</button>
        <button id="logout-btn">Log Out</button>
      </div>
    </aside>

    <main class="main-content">
      <h1>Profile</h1>

      <div class="profile-header">
        <div class="avatar-circle" id="p-avatar">?</div>
        <div>
          <div id="p-name" style="font-weight:700; font-size:18px;"></div>
          <div id="p-email" style="color:#6b7280; font-size:13px;"></div>
          <div id="p-since" style="color:#6b7280; font-size:12px;"></div>
        </div>
      </div>

      <div class="card-block">
        <h2>Edit Info</h2>
        <form id="edit-info-form" novalidate>
          <div class="field">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" />
            <small class="field-error" id="fullName-error"></small>
          </div>
          <div class="field">
            <label for="company">Company</label>
            <input type="text" id="company" />
          </div>
          <button type="submit">Save Changes</button>
        </form>
      </div>

      <div class="card-block" style="margin-top:16px;">
        <h2>Change Password</h2>
        <form id="change-password-form" novalidate>
          <div class="field">
            <label for="currentPassword">Current Password</label>
            <input type="password" id="currentPassword" />
            <small class="field-error" id="currentPassword-error"></small>
          </div>
          <div class="field">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" />
            <small class="field-error" id="newPassword-error"></small>
          </div>
          <div class="field">
            <label for="confirmNewPassword">Confirm New Password</label>
            <input type="password" id="confirmNewPassword" />
            <small class="field-error" id="confirmNewPassword-error"></small>
          </div>
          <button type="submit">Update Password</button>
        </form>
      </div>

      <div class="card-block" style="margin-top:16px;">
        <h2>Danger Zone</h2>
        <p style="font-size:13px; color:#6b7280;">
          This deletes all locally saved clients and re-fetches a fresh
          starter list from the API. Your account is not affected.
        </p>
        <button class="danger-btn" id="reset-data-btn">Reset CRM Data</button>
      </div>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/data.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>

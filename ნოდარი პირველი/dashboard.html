<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - 10X CRM</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/storage.js"></script>
    <script src="js/guard.js"></script>
    <script>
      requireAuth();
    </script>
  </head>
  <body>
    <div id="app-nav"></div>

    <main class="page-content">
      <div class="dash-greeting">
        <h1 id="greeting-text">Welcome back!</h1>
        <p id="dash-clock" class="dash-clock"></p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Clients</div>
          <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Active Deals</div>
          <div class="stat-value" id="stat-active">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Won Revenue</div>
          <div class="stat-value" id="stat-revenue">$0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">New This Week</div>
          <div class="stat-value" id="stat-new">0</div>
        </div>
      </div>

      <div class="dash-row">
        <div class="dash-panel">
          <h2>Pipeline Overview</h2>
          <div id="pipeline-overview" class="pipeline-list"></div>
        </div>

        <div class="dash-panel">
          <h2>Recent Clients</h2>
          <div id="recent-clients" class="recent-list"></div>
          <a href="clients.html" class="view-all-link"
            >View all clients &rarr;</a
          >
        </div>
      </div>
    </main>

    <div id="toast-container"></div>

    <script src="js/ui.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/clients.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        renderNav("dashboard");
        applyTheme();
      });
    </script>
  </body>
</html>

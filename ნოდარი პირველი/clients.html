<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients - 10X CRM</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/storage.js"></script>
  <script src="js/guard.js"></script>
  <script>requireAuth();</script>
</head>
<body>

  <div id="app-nav"></div>

  <main class="page-content">
    <div class="page-header">
      <h1>Clients</h1>
      <button id="add-client-btn" class="btn-primary" type="button">+ Add Client</button>
    </div>

    <div id="clients-status"></div>

    <div id="clients-list"></div>
  </main>

  <div id="add-client-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Add Client</h2>
        <button id="close-modal-btn" class="modal-close-btn" type="button">&times;</button>
      </div>

      <form id="add-client-form" novalidate>
        <div class="form-group">
          <label for="clientName">Name</label>
          <input type="text" id="clientName" name="clientName">
          <span class="error-message" id="clientName-error"></span>
        </div>

        <div class="form-group">
          <label for="clientEmail">Email</label>
          <input type="text" id="clientEmail" name="clientEmail">
          <span class="error-message" id="clientEmail-error"></span>
        </div>

        <div class="form-group">
          <label for="clientPhone">Phone</label>
          <input type="text" id="clientPhone" name="clientPhone">
          <span class="error-message" id="clientPhone-error"></span>
        </div>

        <div class="form-group">
          <label for="clientCompany">Company</label>
          <input type="text" id="clientCompany" name="clientCompany">
        </div>

        <div class="form-group">
          <label for="clientDealValue">Deal Value</label>
          <input type="text" id="clientDealValue" name="clientDealValue">
          <span class="error-message" id="clientDealValue-error"></span>
        </div>

        <div class="form-group">
          <label for="clientStatus">Status</label>
          <select id="clientStatus" name="clientStatus">
            <option value="Lead">Lead</option>
            <option value="Contacted">Contacted</option>
            <option value="Won">Won</option>
            <option value="Lost">Lost</option>
          </select>
        </div>

        <button type="submit" class="btn-primary">Add Client</button>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/clients.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      renderNav('clients');
      applyTheme();
    });
  </script>
</body>
</html>

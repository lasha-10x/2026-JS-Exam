<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - 10X CRM</title>

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/toast.css" />
    
    <script src="js/theme.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/guard.js"></script>
    <script defer src="js/toast.js"></script>
    <script defer src="js/validation.js"></script>
    <script defer src="js/auth.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-container">
      <div class="auth-card">
        <h1 class="auth-card__title">Create your account</h1>
        <p class="auth-card__text">Sign up to get started with 10X CRM</p>

        <form id="signup-form" class="auth-form" novalidate>
          <!-- 1. Full Name -->
          <div class="form-group">
            <label for="fullName" class="form-group__label">Full Name</label>
            <div class="form-group__input-wrapper">
              <svg
                class="form-group__icon"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
                />
              </svg>
              <input
                type="text"
                id="fullName"
                name="fullName"
                class="form-group__input"
                placeholder="Nino Beridze"
              />
            </div>
            <span class="form-group__error-message" id="fullName-error"></span>
          </div>

          <!-- 2. Email -->
          <div class="form-group">
            <label for="email" class="form-group__label">Email</label>
            <div class="form-group__input-wrapper">
              <svg
                class="form-group__icon"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"
                />
              </svg>
              <input
                type="email"
                id="email"
                name="email"
                class="form-group__input"
                placeholder="you@example.com"
                autocomplete="username"
              />
            </div>
            <span class="form-group__error-message" id="email-error"></span>
          </div>

          <!-- 3. Company (optional) -->
          <div class="form-group">
            <label for="company" class="form-group__label">Company</label>
            <div class="form-group__input-wrapper">
              <svg
                class="form-group__icon"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.25 21h19.5m-18-18v18m10.5-18v18m6-13.5V21M6.75 6.75h.75m-.75 3h.75m-.75 3h.75m3-6h.75m-.75 3h.75m-.75 3h.75M6.75 21v-3.375c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21M3 3h12m-.75 4.5H21m-3.75 3.75h.008v.008h-.008v-.008Zm0 3h.008v.008h-.008v-.008Z"
                />
              </svg>
              <input
                type="text"
                id="company"
                name="company"
                class="form-group__input"
                placeholder="Company (optional)"
              />
            </div>
            <span class="form-group__error-message" id="company-error"></span>
          </div>

          <!-- 4. Password -->
          <div class="form-group">
            <label for="password" class="form-group__label">Password</label>
            <div class="form-group__input-wrapper">
              <svg
                class="form-group__icon"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"
                />
              </svg>
              <input
                type="password"
                id="password"
                name="password"
                class="form-group__input"
                placeholder="••••••••"
                autocomplete="new-password"
              />
            </div>
            <span class="form-group__error-message" id="password-error"></span>
          </div>

          <!-- 5. Confirm Password -->
          <div class="form-group">
            <label for="confirmPassword" class="form-group__label"
              >Confirm Password</label
            >
            <div class="form-group__input-wrapper">
              <svg
                class="form-group__icon"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"
                />
              </svg>
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                class="form-group__input"
                placeholder="••••••••"
                autocomplete="new-password"
              />
            </div>
            <span
              class="form-group__error-message"
              id="confirmPassword-error"
            ></span>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="auth-form__submit-btn">
            Create Account
          </button>
        </form>

        <!-- Toggle Link to Login -->
        <p class="auth-card__footer">
          Already have an account?
          <a href="index.html" class="auth-card__link">Log in</a>
        </p>
      </div>
    </main>
  </body>
</html>
